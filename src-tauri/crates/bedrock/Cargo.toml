[package]
name = "bedrock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
models = { path = "../models" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aws-config = { version = "=1.12.0", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "=1.147.0"
aws-sdk-bedrock = "=1.159.0"
aws-sdk-bedrockagentruntime = "=1.144.0"
aws-sdk-translate = "=1.113.0"
aws-sdk-s3 = "=1.150.0"
aws-smithy-types = { version = "=1.8.1", features = ["http-body-1-x"] }
aws-smithy-eventstream = "=0.61.4"
http-body = "=1.1.0"
bytes = "=1.12.1"
aws-credential-types = "=1.3.0"
aws-smithy-http-client = { version = "=1.5.0", features = ["rustls-aws-lc"] }
tokio = { version = "=1.53.1", features = ["time", "macros", "sync", "rt", "fs", "io-util"] }
tokio-util = "=0.7.19"
base64 = "=0.22.1"
tracing = "=0.1.44"

[dev-dependencies]
tempfile.workspace = true
aws-smithy-http-client = { version = "=1.5.0", features = ["rustls-aws-lc", "test-util"] }
http = "=1.5.0"
tokio = { version = "=1.53.1", features = ["time", "macros", "sync", "rt", "fs", "io-util", "rt-multi-thread", "test-util"] }
