[package]
name = "knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["local-embeddings"]
# On-device embeddings: multilingual-e5-small run with candle (pure Rust, so it works on every
# platform the app builds for, including Intel Macs, without a native runtime to ship).
local-embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
common = { path = "../common" }
bedrock = { path = "../bedrock" }
tools = { path = "../tools" }
mcp = { path = "../mcp" }
rusqlite.workspace = true
sqlite-vec = "=0.1.9"
rmcp = { version = "=3.6.0", default-features = false, features = ["server"] }
tokio = { version = "=1.54.0", features = ["sync", "rt", "macros", "time", "fs", "io-util"] }
tokio-util = "=0.7.20"
async-trait = "=0.1.92"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", features = ["stream"] }
url = "=2.5.8"
dom_smoothie = "=0.18.2"
dom_query = "=0.28.0"
texting_robots = "=0.2.2"
calamine = { version = "=0.37.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
tracing = "=0.1.44"
dirs.workspace = true
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"], optional = true }

[[bin]]
# Builds docs/help-kb.db (the user guide's shipped knowledge base); see src/bin/build_help_kb.rs.
name = "build-help-kb"
path = "src/bin/build_help_kb.rs"
required-features = ["local-embeddings"]

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "=1.54.0", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "fs", "io-util", "net"] }
