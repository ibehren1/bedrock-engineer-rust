name: Build (private)

# The private Gitea repo's workflow. Gitea runs .gitea/workflows when it exists (and then ignores
# .github/workflows); GitHub never reads this folder, so public releases stay on GitHub
# (.github/workflows/build-and-release.yml).
#
# Pull requests: the checks only. Merges to main (and manual runs): the checks, then full
# installers for every platform there is a runner for, attached to a Gitea release v<version>
# on this repo. Nothing is published to GitHub from here.
#
# Runners are picked by label. Set the repository variables GITEA_LINUX_RUNNER and
# GITEA_MACOS_RUNNER to your act_runner labels if they differ from the defaults below. The macOS
# runner must be a host runner on a Mac with the Xcode command line tools.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  NODE_OPTIONS: '--max-old-space-size=8192'
  CARGO_TERM_COLOR: always
  # Self-hosted runners have far less memory than GitHub's: linking the test binaries with full
  # debug info, several at once, gets ld killed (signal 9). No debug info for CI builds, and a
  # bounded number of parallel jobs (repo variable CARGO_BUILD_JOBS, default 2).
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '2' }}

jobs:
  checks:
    name: Checks
    runs-on: ${{ vars.GITEA_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux system dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file pkg-config libclang-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: gitea-linux

      - name: Install cargo-about and cargo-audit
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about,cargo-audit

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --locked --no-fail-fast

      - name: Run unit tests
        run: npm test

      - name: Generate third-party notices
        run: npm run notices

  # Creates (or finds) the release v<version> the installers are attached to, once, so the build
  # jobs don't race to create it.
  release:
    name: Prepare release
    needs: [checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.GITEA_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build release notes from CHANGELOG
        run: |
          awk '
            /^### [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ {
              if (seen) exit
              seen = 1
            }
            seen
          ' CHANGELOG.md > update-summary.md
          test -s update-summary.md

      - name: Create or find the release
        id: release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          existing=$(curl -sS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" || true)
          id=$(printf '%s' "$existing" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.id?String(j.id):"")}catch{}})')
          if [ -z "$id" ]; then
            body=$(node -e 'const fs=require("fs");process.stdout.write(JSON.stringify({tag_name:process.argv[1],target_commitish:process.argv[2],name:process.argv[1],body:fs.readFileSync("update-summary.md","utf8"),draft:false,prerelease:false}))' "$TAG" "$SHA")
            created=$(curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$body" "$API/releases")
            id=$(printf '%s' "$created" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).id)))')
            echo "Created release $TAG ($id)"
          else
            echo "Release $TAG already exists ($id); its installers will be replaced"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Installers (${{ matrix.name }})
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: linux
            tauri_args: --bundles appimage,deb
          - name: macos
            runner: macos
            tauri_args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.runner == 'macos' && (vars.GITEA_MACOS_RUNNER || 'macos') || (vars.GITEA_LINUX_RUNNER || 'ubuntu-latest') }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file pkg-config libclang-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: gitea-${{ matrix.name }}

      - name: Install cargo-about
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about

      - name: Install dependencies
        run: npm ci

      - name: Generate third-party notices
        run: npm run notices

      # Private builds: no update signing (the updater feed is the public GitHub release) and, on
      # macOS, the ad-hoc signature from tauri.conf.json.
      - name: Build app
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri -- build ${{ matrix.tauri_args }}

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-installers
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) |
          while IFS= read -r f; do
            case "$f" in
              *.dmg) ext=dmg ;;
              *.AppImage) ext=AppImage ;;
              *.deb) ext=deb ;;
            esac
            # Native Linux builds have no target triple in the path; name them by the runner's CPU.
            case "$f" in
              *universal*) arch=universal ;;
              *aarch64*|*arm64*) arch=arm64 ;;
              *) case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=x64 ;; esac ;;
            esac
            cp "$f" "dist-installers/bedrock-engineer-rust-${VERSION}-${arch}.${ext}"
          done
          ls -la dist-installers
          test -n "$(ls dist-installers)"

      - name: Attach installers to the release
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
        run: |
          set -euo pipefail
          assets=$(curl -sSf -H "Authorization: token $TOKEN" "$API/releases/$RELEASE_ID/assets")
          for f in dist-installers/*; do
            name=$(basename "$f")
            # A re-run replaces the asset of the same name.
            old=$(printf '%s' "$assets" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s).find(x=>x.name===process.argv[1]);process.stdout.write(a?String(a.id):"")})' "$name")
            if [ -n "$old" ]; then
              curl -sSf -X DELETE -H "Authorization: token $TOKEN" "$API/releases/$RELEASE_ID/assets/$old"
            fi
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$RELEASE_ID/assets?name=$name" > /dev/null
            echo "Attached $name"
          done
